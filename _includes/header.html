<!-- Header
============================================= -->
<header id="header" class="{% if page.layout == 'home' %}transparent-header dark{% endif %}" data-sticky-class="not-dark" data-responsive-class="not-dark">
  <div id="header-wrap">
    <div class="container">
      <div class="header-row">

        <!-- Logo
        ============================================= -->
        <div id="logo">
          <a href="{{ "/" | relative_url}}">
            <img class="logo-default" srcset="/images/logo.png, /images/logo@2x.png 2x" src="/images/logo@2x.png" alt="nikhil trivedi">
            <img class="logo-dark" srcset="/images/logo-dark.png, /images/logo-dark@2x.png 2x" src="/images/logo-dark@2x.png" alt="nikhil trivedi">
          </a>
        </div><!-- #logo end -->

        <div class="header-misc">
        </div>

        <div class="primary-menu-trigger">
          <button class="cnvs-hamburger" type="button" title="Open Mobile Menu">
            <span class="cnvs-hamburger-box"><span class="cnvs-hamburger-inner"></span></span>
          </button>
        </div>

        <!-- Primary Navigation
        ============================================= -->
        <nav class="primary-menu">
        	<ul class="menu-container">
            <li class="menu-item{% if page.layout == "home" %} current{% endif %}"><a class="menu-link" href="{{ "/" | relative_url}}"><div>Home</div></a></li>
            <li class="menu-item{% if page.url == "/projects/" %} current{% endif %}"><a class="menu-link" href="{{ "/projects" | relative_url}}"><div>Projects</div></a></li>
            <li class="menu-item{% if page.url == "/blog/" or page.layout == "post"%} current{% endif %}"><a class="menu-link" href="{{ "/blog" | relative_url}}"><div>Blog</div></a></li>
        	</ul>
        </nav><!-- .primary-menu end -->
      </div>
    </div>
  </div>
  <div class="header-wrap-clone"></div>
</header><!-- #header end -->
