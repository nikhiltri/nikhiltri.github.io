<!DOCTYPE html>
<html dir="ltr" lang="{{ page.lang | default: site.lang | default: "en-US" }}">

  {% include head.html %}

  <body class="stretched no-transition">

    <!-- Document Wrapper
	 ============================================= -->
    <div id="wrapper">

      {% include header.html %}

      {{ content }}

      {% include footer.html %}

    </div>

    <!-- Go To Top
	 ============================================= -->
    <div id="gotoTop" class="uil uil-angle-up"></div>

    <!-- Canvas JavaScripts
    ============================================= -->
    <script>
      // Canvas lazy-loads extra files relative to this folder
      var cnvsOptions = { jsFolder: '{{ "/assets/vendor/canvas/js/" | relative_url }}' };
    </script>
    <script src="{{ "/assets/vendor/canvas/js/plugins.min.js" | relative_url }}"></script>
    <script src="{{ "/assets/vendor/canvas/js/functions.bundle.js" | relative_url }}"></script>

    <!-- Custom Scripts
	 ============================================= -->
    <script src="{{ "/assets/js/custom.js" | relative_url }}"></script>
  </body>
</html>
